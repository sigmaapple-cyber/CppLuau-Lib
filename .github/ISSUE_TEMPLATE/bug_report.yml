name: Bug report
description: Report a reproducible problem in CppLuau-Lib.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: Please include a minimal reproduction and the Luau/Roblox environment where the issue occurs.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include the smallest code sample that reproduces the issue.
      render: lua
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Roblox Studio, Luau version, Rojo/Wally versions, or other relevant details.
    validations:
      required: false
